name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yaml-lint:
    name: Lint pipeline YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install --user yamllint
      - name: yamllint Pipelines/
        run: yamllint -c .yamllint.yml Pipelines .github/workflows

  powershell-lint:
    name: Lint PowerShell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Parse every .ps1 file
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path PowerShell, .github -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors[0].Message)"
            }
          }
          if ($failed) { exit 1 }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path PowerShell -Recurse -Settings PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String -Width 400 | Write-Host
          $errors = $results | Where-Object Severity -eq 'Error'
          Write-Host "Warnings: $(($results | Where-Object Severity -eq 'Warning').Count)  Errors: $($errors.Count)"
          if ($errors.Count -gt 0) { exit 1 }

  json-schema:
    name: Validate JSON files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse JSON
        run: |
          set -e
          for f in version.json deployment-settings.sample.json deployment-settings.schema.json devops-tasks-schema.json; do
            python3 -c "import json,sys; json.load(open('$f', encoding='utf-8-sig'))" && echo "ok $f"
          done
